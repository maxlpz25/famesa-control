<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAMESA - Acceso Seguro Multi-Sede</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-[#080C17] text-slate-100 min-h-screen flex items-center justify-center p-4 font-sans">
    <div class="max-w-md w-full bg-[#111827] border border-slate-800 rounded-3xl p-8 shadow-2xl relative overflow-hidden">
        <div class="absolute top-0 left-0 right-0 h-1.5 bg-[#E30613]"></div>
        <div class="text-center mb-6">
            <div class="bg-white p-2.5 rounded-2xl inline-block mb-3 shadow">
                <img src="/static/logo_famesa.png" alt="FAMESA" class="h-9 object-contain" onerror="this.src='/static/icono_famesa.png'">
            </div>
            <h2 class="text-base font-bold text-white uppercase tracking-wider">Acceso al Sistema</h2>
            <p class="text-xs text-slate-400 mt-1">Puente Piedra • Chancay • La Joya</p>
        </div>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="mb-4 p-3 rounded-xl bg-red-900/40 border border-red-500/50 text-red-200 text-xs flex items-center gap-2">
                    <i class="fa-solid fa-triangle-exclamation text-red-400"></i> {{ messages[0] }}
                </div>
            {% endif %}
        {% endwith %}

        <form method="POST" action="/login" class="space-y-4 text-xs">
            <div>
                <label class="block text-slate-300 font-semibold mb-1">Usuario</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-500">
                        <i class="fa-solid fa-user"></i>
                    </span>
                    <input type="text" name="username" required placeholder="Ingresa tu usuario" class="w-full bg-[#080C17] border border-slate-700 rounded-xl pl-9 pr-3 py-2.5 text-white focus:outline-none focus:border-[#E30613]">
                </div>
            </div>
            <div>
                <label class="block text-slate-300 font-semibold mb-1">Contraseña</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-500">
                        <i class="fa-solid fa-lock"></i>
                    </span>
                    <input type="password" name="password" required placeholder="••••••••" class="w-full bg-[#080C17] border border-slate-700 rounded-xl pl-9 pr-3 py-2.5 text-white focus:outline-none focus:border-[#E30613]">
                </div>
            </div>
            <button type="submit" class="w-full py-3 bg-[#E30613] hover:bg-[#B7050F] text-white font-bold rounded-xl text-sm shadow-lg shadow-red-600/30 transition flex items-center justify-center gap-2">
                <i class="fa-solid fa-right-to-bracket"></i> Iniciar Sesión
            </button>
        </form>

        <div class="mt-3 text-center">
            <a href="/recuperar_password" class="text-xs text-amber-400 hover:text-amber-300 font-medium transition flex items-center justify-center gap-1.5">
                <i class="fa-solid fa-unlock-keyhole text-[11px]"></i> ¿Olvidaste tu contraseña? Recuperar aquí
            </a>
        </div>

        <div class="mt-6 pt-4 border-t border-slate-800 text-center">
            <a href="/" class="text-xs text-slate-400 hover:text-white flex items-center justify-center gap-1.5 transition">
                <i class="fa-solid fa-arrow-left"></i> Volver a la Pantalla Pública
            </a>
        </div>
    </div>
</body>
</html>
