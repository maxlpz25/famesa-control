<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>FAMESA EXPLOSIVOS - Iniciar Sesión</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-8 shadow-2xl space-y-6">
        <div class="text-center space-y-2">
            <div class="bg-red-600 text-white w-14 h-14 mx-auto rounded-xl flex items-center justify-center text-2xl shadow-lg"><i class="fa-solid fa-industry"></i></div>
            <h2 class="text-xl font-black tracking-wider text-white">ACCESO AL SISTEMA</h2>
            <p class="text-xs text-slate-400">Puente Piedra • Chancay • La Joya</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="bg-red-950 border border-red-700 text-red-200 text-xs p-3 rounded-lg text-center font-semibold">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="POST" class="space-y-4">
            <div>
                <label class="text-xs font-bold text-slate-400 block mb-1">Usuario</label>
                <input type="text" name="username" required placeholder="Ingrese su usuario" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-3 text-white text-sm focus:border-red-600 focus:outline-none transition">
            </div>
            <div>
                <label class="text-xs font-bold text-slate-400 block mb-1">Contraseña</label>
                <input type="password" name="password" required placeholder="••••••••" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-3 text-white text-sm focus:border-red-600 focus:outline-none transition">
            </div>
            <button type="submit" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold p-3 rounded-lg text-sm shadow-lg transition flex items-center justify-center space-x-2">
                <i class="fa-solid fa-right-to-bracket"></i>
                <span>Iniciar Sesión</span>
            </button>
        </form>

        <div class="text-center pt-2">
            <a href="/" class="text-xs text-slate-400 hover:text-white transition"><i class="fa-solid fa-arrow-left mr-1"></i> Volver a la Pantalla Pública</a>
        </div>
    </div>
</body>
</html>
